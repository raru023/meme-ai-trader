name: Meme AI Trader Paper

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  paper-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trader
        run: python3 bot.py

      - name: Commit updated paper state
        run: |
          git config user.name "meme-ai-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update paper trading state"
          git push
