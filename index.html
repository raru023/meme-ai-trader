<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meme AI Trader</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b0d12;color:#f5f7fb;margin:0;padding:18px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#151922;border:1px solid #292e3a;border-radius:14px;padding:14px}.v{font-size:22px;font-weight:700}.muted{color:#8d96a8;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}td,th{padding:8px;border-bottom:1px solid #292e3a;text-align:left}.pass{color:#70e39a}.block{color:#ff8585}.bar{height:8px;background:#2a2f3b;border-radius:5px;overflow:hidden}.fill{height:100%;background:#7aa7ff}</style></head><body><h1>🧠 Meme AI Trader</h1><div class="muted" id="status">読み込み中...</div><div class="grid"><div class="card"><div class="muted">MODE</div><div class="v" id="mode">-</div></div><div class="card"><div class="muted">P&L</div><div class="v" id="pnl">-</div></div><div class="card"><div class="muted">WIN RATE</div><div class="v" id="win">-</div></div><div class="card"><div class="muted">DATA</div><div class="v" id="data">-</div></div></div><div class="card" style="margin-top:12px"><b>候補コイン</b><table><thead><tr><th>Token</th><th>Score</th><th>Gate</th><th>Liquidity</th><th>24h Vol</th></tr></thead><tbody id="rows"></tbody></table></div><div class="card" style="margin-top:12px"><b>安全設定</b><p class="muted">Live取引はこのMVPでは無効。実市場データは候補発見のみに使用。</p><div id="risk" class="muted"></div></div><script>const owner='raru023',repo='meme-ai-trader';const url=`https://raw.githubusercontent.com/${owner}/${repo}/main/data/state.json`;async function load(){try{const r=await fetch(url+'?t='+Date.now());const s=await r.json();document.getElementById('status').textContent='更新: '+s.updated_at;document.getElementById('mode').textContent=s.mode||'-';document.getElementById('pnl').textContent=(s.pnl>=0?'+':'')+(s.pnl??0)+'円';document.getElementById('win').textContent=(s.win_rate??0)+'%';document.getElementById('data').textContent=s.data_status||'-';document.getElementById('rows').innerHTML=(s.candidates||[]).map(c=>`<tr><td>${c.symbol||'-'}</td><td>${c.score||0}</td><td class="${c.security_gate==='PASS'?'pass':'block'}">${c.security_gate||'-'}</td><td>$${Math.round(c.liquidity_usd||0).toLocaleString()}</td><td>$${Math.round(c.volume_24h_usd||0).toLocaleString()}</td></tr>`).join('');const r=s.risk||{};document.getElementById('risk').textContent=`1回リスク ${r.max_risk_per_trade_pct??'-'}% / Daily Loss ${r.max_daily_loss_pct??'-'}% / 最大保有 ${r.max_open_positions??'-'}`;}catch(e){document.getElementById('status').textContent='state.jsonを読み込めません: '+e}}load();setInterval(load,60000);</script></body></html>
